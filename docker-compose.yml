# Local dev databases. Start only what you need: `docker compose up -d postgres redis`

services:
  postgres:
    image: postgres:18
    container_name: db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user_postgres
      POSTGRES_PASSWORD: pass_postgres
      POSTGRES_DB: simple_bank
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  adminer:
    image: adminer
    container_name: db-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
